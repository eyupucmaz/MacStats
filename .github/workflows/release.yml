name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic tag to release, for example v0.2.0 (run the workflow from that same tag)
        required: true
        type: string

# Read-only by default; only the publish job may write repository contents.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  XCODE_APP: /Applications/Xcode_16.4.app

jobs:
  build:
    name: Build and verify release
    runs-on: macos-15
    permissions:
      contents: read
      # Lets Scripts/require-ci-success.sh read the CI runs of the tagged commit.
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate existing release tag
        id: tag
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # The protected `release` environment only accepts tag refs, so a manual
          # run must be dispatched from the tag itself.
          if [ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]; then
            printf 'error: run the release from its tag: gh workflow run release.yml --ref %s -f tag=%s\n' \
              "${RELEASE_TAG}" "${RELEASE_TAG}" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELEASE_TAG}")"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Require the tag to be on main
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            printf 'error: %s (%s) is not an ancestor of origin/main; release only from main\n' \
              "${RELEASE_TAG}" "${tag_commit}" >&2
            exit 1
          fi
          printf '%s (%s) is on origin/main.\n' "${RELEASE_TAG}" "${tag_commit}"
      - name: Require CI to have passed on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          bash Scripts/require-ci-success.sh "${GITHUB_REPOSITORY}" "${tag_commit}"
      - name: Derive build number
        shell: bash
        run: |
          build_number="$(bash Scripts/build-number.sh)"
          printf 'Build number: %s\n' "${build_number}"
          printf 'BUILD_NUMBER=%s\n' "${build_number}" >> "${GITHUB_ENV}"
      - name: Select Xcode
        run: |
          test -d "${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Check for SMC fan-write paths
        run: bash Scripts/check-monitoring-only.sh
      - name: Validate shell scripts
        run: for script in Scripts/*.sh; do bash -n "$script"; done
      - name: Run release safety tests
        run: bash Tests/ReleaseSafetyTests.sh
      - name: Run Swift tests
        run: swift test
      - name: Build Universal app
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          APP_VERSION="${RELEASE_VERSION}" BUILD_NUMBER="${BUILD_NUMBER}" RELEASE_STRICT=1 \
            bash Scripts/build-app.sh
      - name: Package and verify DMG
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          bash Scripts/package-dmg.sh "${RELEASE_VERSION}"
          bash Scripts/verify-release.sh "${RELEASE_VERSION}" "${BUILD_NUMBER}"
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: MacStats-release
          path: |
            dist/MacStats-${{ steps.tag.outputs.version }}-universal.dmg
            dist/MacStats-${{ steps.tag.outputs.version }}-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Public Preview
    needs: build
    runs-on: ubuntu-24.04
    # Protected environment: deployments are limited to tags matching v*.*.*.
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: MacStats-release
          path: dist
      - name: Re-verify checksum
        shell: bash
        run: |
          cd dist
          shasum -a 256 -c "MacStats-${RELEASE_VERSION}-universal.dmg.sha256"
      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --silent "repos/${GITHUB_REPOSITORY}" >/dev/null; then
            printf 'error: cannot authenticate to or access repository API for %s\n' "${GITHUB_REPOSITORY}" >&2
            exit 1
          fi

          release_lookup="$(mktemp)"
          trap 'rm -f -- "${release_lookup}"' EXIT
          set +e
          gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${release_lookup}" 2>&1
          release_lookup_status=$?
          set -e

          if [ "${release_lookup_status}" -eq 0 ]; then
            printf 'error: release %s already exists; publish a new version instead\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "${release_lookup}"; then
            printf 'Confirmed that release %s does not exist.\n' "${RELEASE_TAG}"
          else
            sed 's/^/gh: /' "${release_lookup}" >&2
            printf 'error: could not confirm that release %s is absent\n' "${RELEASE_TAG}" >&2
            exit "${release_lookup_status}"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (Node 24)
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: MacStats ${{ env.RELEASE_TAG }} Public Preview
          prerelease: true
          generate_release_notes: true
          body: |
            MacStats ${{ env.RELEASE_TAG }} Public Preview monitors your Mac from the menu bar: CPU, GPU, memory, disk, network, battery, and, where the hardware exposes them, fan speeds and temperatures. It only reads the SMC: there are no SMC or fan writes, and MacStats does not control fans.

            Optional audio controls let you choose the default output and input devices and adjust output volume and mute. The per-app mixer (App Mixer) requires macOS 14.2 or later and asks for audio-capture permission when you enable it; audio is processed locally.

            This build is ad-hoc signed and is not notarized. Open the DMG and drag `MacStats.app` to Applications. On first launch, use Control-click → Open, or choose Open Anyway in System Settings → Privacy & Security.

            Verify the download before opening it:

            ```bash
            shasum -a 256 -c MacStats-${{ env.RELEASE_VERSION }}-universal.dmg.sha256
            ```
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/MacStats-${{ env.RELEASE_VERSION }}-universal.dmg
            dist/MacStats-${{ env.RELEASE_VERSION }}-universal.dmg.sha256
