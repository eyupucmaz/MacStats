name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Publish Public Preview
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate existing release tag
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELEASE_TAG}")"
      - name: Check monitoring-only constraints
        run: bash Scripts/check-monitoring-only.sh
      - name: Validate shell scripts
        run: for script in Scripts/*.sh; do bash -n "$script"; done
      - name: Run release safety tests
        run: bash Tests/ReleaseSafetyTests.sh
      - name: Run Swift tests
        run: swift test
      - name: Build Universal app
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          APP_VERSION="${version}" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" RELEASE_STRICT=1 \
            bash Scripts/build-app.sh
      - name: Package and verify DMG
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          bash Scripts/package-dmg.sh "${version}"
          bash Scripts/verify-release.sh "${version}" "${GITHUB_RUN_NUMBER}"
      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --silent "repos/${GITHUB_REPOSITORY}" >/dev/null; then
            printf 'error: cannot authenticate to or access repository API for %s\n' "${GITHUB_REPOSITORY}" >&2
            exit 1
          fi

          release_lookup="$(mktemp)"
          trap 'rm -f -- "${release_lookup}"' EXIT
          set +e
          gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${release_lookup}" 2>&1
          release_lookup_status=$?
          set -e

          if [ "${release_lookup_status}" -eq 0 ]; then
            printf 'error: release %s already exists; publish a new version instead\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "${release_lookup}"; then
            printf 'Confirmed that release %s does not exist.\n' "${RELEASE_TAG}"
          else
            sed 's/^/gh: /' "${release_lookup}" >&2
            printf 'error: could not confirm that release %s is absent\n' "${RELEASE_TAG}" >&2
            exit "${release_lookup_status}"
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: MacStats ${{ env.RELEASE_TAG }} Public Preview
          prerelease: true
          generate_release_notes: true
          body: |
            MacStats v0.1.0 Public Preview is monitoring-only; it reads local system metrics and does not control fans.

            This build is ad-hoc signed and is not notarized. Open the DMG and drag `MacStats.app` to Applications. On first launch, use Control-click → Open, or choose Open Anyway in System Settings → Privacy & Security.

            Verify the download before opening it:

            ```bash
            shasum -a 256 -c MacStats-0.1.0-universal.dmg.sha256
            ```
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/MacStats-*-universal.dmg
            dist/MacStats-*-universal.dmg.sha256
