name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Present on both macos-15 (arm64) and macos-15-intel images; see
  # https://github.com/actions/runner-images/tree/main/images/macos
  XCODE_APP: /Applications/Xcode_16.4.app

jobs:
  lint:
    name: ShellCheck
    # shellcheck is preinstalled on Ubuntu runner images but not on macOS ones.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck Scripts/*.sh Tests/*.sh

  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select Xcode
        run: |
          test -d "${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Check for SMC fan-write paths
        run: bash Scripts/check-monitoring-only.sh
      - name: Validate shell scripts
        run: for script in Scripts/*.sh; do bash -n "$script"; done
      - name: Run release safety tests
        run: bash Tests/ReleaseSafetyTests.sh
      - name: Run Swift tests
        run: swift test

  package-universal:
    name: Package Universal App
    needs: [lint, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Scripts/build-number.sh counts commits, which needs the full history.
          fetch-depth: 0
      - name: Select Xcode
        run: |
          test -d "${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Read source version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          printf 'Source version: %s\n' "${version}"
          printf 'APP_VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"
      - name: Derive build number
        run: |
          build_number="$(bash Scripts/build-number.sh)"
          printf 'Build number: %s\n' "${build_number}"
          printf 'BUILD_NUMBER=%s\n' "${build_number}" >> "${GITHUB_ENV}"
      - name: Build Universal app
        run: BUILD_NUMBER="${BUILD_NUMBER}" RELEASE_STRICT=1 bash Scripts/build-app.sh
      - name: Verify Universal app
        run: bash Scripts/verify-app.sh dist/MacStats.app "${APP_VERSION}" "${BUILD_NUMBER}"
      - name: Upload Universal app diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: MacStats-universal-app
          path: dist/MacStats.app
          if-no-files-found: error
          retention-days: 7
